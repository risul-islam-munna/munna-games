<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a30"/>
      <stop offset="1" stop-color="#0e0f13"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8ec2ff"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="130" cy="90" r="360" fill="url(#glow)"/>
  <circle cx="1080" cy="560" r="320" fill="#1f4e8c" fill-opacity="0.35"/>

  <g transform="translate(90,150)">
    <rect x="0" y="0" width="96" height="96" rx="22" fill="#0e0f13" stroke="url(#grad)" stroke-width="3"/>
    <g stroke="url(#grad)" stroke-width="5" stroke-linecap="round">
      <line x1="36" y1="14" x2="36" y2="82"/>
      <line x1="60" y1="14" x2="60" y2="82"/>
      <line x1="14" y1="36" x2="82" y2="36"/>
      <line x1="14" y1="60" x2="82" y2="60"/>
    </g>
  </g>

  <text x="210" y="228" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="70" font-weight="700" letter-spacing="14" fill="#ffffff">DUAL <tspan fill="url(#grad)">PLAY</tspan></text>

  <text x="92" y="360" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="58" font-weight="700" fill="#ffffff">Four classic games. One app.</text>
  <text x="92" y="428" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="58" font-weight="700" fill="#a8adbd">No account, no clutter.</text>

  <text x="92" y="512" font-family="'Segoe UI',sans-serif" font-size="30" fill="#a8adbd">Tic Tac Toe &#183; Ludo &#183; Dots and Boxes &#183; Bagh-Bandi</text>
  <text x="92" y="558" font-family="'Segoe UI',sans-serif" font-size="26" fill="#71768a">Play offline vs smart bots &#183; pass &amp; play &#183; 2&#8211;4 players over Wi-Fi</text>

  <text x="1108" y="558" text-anchor="end" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="26" font-weight="600" fill="#b79bff">games.munna.dev</text>
</svg>
