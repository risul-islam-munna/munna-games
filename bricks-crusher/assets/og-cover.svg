<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2430"/>
      <stop offset="1" stop-color="#0e0f13"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#e040fb"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1080" cy="80" r="360" fill="url(#glow)"/>
  <circle cx="90" cy="580" r="320" fill="#7c1fa2" fill-opacity="0.22"/>

  <!-- brick wall -->
  <g>
    <rect x="90" y="150" width="120" height="46" rx="8" fill="#00e5ff"/>
    <rect x="222" y="150" width="120" height="46" rx="8" fill="#e040fb"/>
    <rect x="354" y="150" width="120" height="46" rx="8" fill="#ffc400"/>
    <rect x="486" y="150" width="120" height="46" rx="8" fill="#76ff03"/>
    <rect x="156" y="208" width="120" height="46" rx="8" fill="#e040fb" opacity="0.9"/>
    <rect x="288" y="208" width="120" height="46" rx="8" fill="#00e5ff" opacity="0.9"/>
    <rect x="420" y="208" width="120" height="46" rx="8" fill="#ffc400" opacity="0.9"/>
  </g>

  <!-- ball + paddle -->
  <circle cx="330" cy="300" r="9" fill="#ffffff"/>
  <rect x="230" y="330" width="130" height="18" rx="9" fill="url(#grad)"/>

  <rect x="90" y="380" width="150" height="44" rx="22" fill="none" stroke="#ffdcae" stroke-width="2"/>
  <text x="165" y="408" text-anchor="middle" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="20" font-weight="700" letter-spacing="2" fill="#ffdcae">IN DEVELOPMENT</text>

  <text x="90" y="480" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="70" font-weight="700" letter-spacing="6" fill="#ffffff">BRICKS <tspan fill="url(#grad)">CRUSHER</tspan></text>
  <text x="92" y="530" font-family="'Segoe UI',sans-serif" font-size="28" fill="#a8adbd">A neon Arkanoid-style brick breaker &#8212; built solo in Dhaka</text>

  <text x="1108" y="590" text-anchor="end" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="26" font-weight="600" fill="#7ee6f5">games.munna.dev/bricks-crusher</text>
</svg>
