<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/dual-play/play/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Play Dual Play in your browser: Tic Tac Toe, Ludo, Dots and Boxes, Bagh-Bandi, Wall Block and Memory Match against bots or a friend. Free, no install, no account.">
  <meta name="theme-color" content="#14131B">

  <!--
    SEO: the indexable page for this game is the landing page at /dual-play/.
    This URL is the interactive app only, so keep it out of search results
    (links on it are still followed) and don't duplicate landing-page content.
  -->
  <meta name="robots" content="noindex,follow">

  <!-- Open Graph (link previews when someone shares the play URL) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Dual Play">
  <meta property="og:title" content="Play Dual Play in your browser">
  <meta property="og:description" content="Seven classic games, free in your browser. No install, no account.">
  <meta property="og:url" content="https://games.munna.dev/dual-play/play/">
  <meta property="og:image" content="https://games.munna.dev/dual-play/assets/og-cover.png">
  <meta name="twitter:card" content="summary_large_image">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Dual Play">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Play Dual Play Online — Munna Games</title>
  <style>
    /* Web only: "Munna Games" site panel in the empty desktop margin to the
       left of the 800px game frame. The frame is centred and 800px wide, so the
       panel's right edge sits a fixed gap left of (50vw - 400px). It only
       renders when that margin is wide enough, so it never overlaps the game or
       takes space from it; on narrower windows and phones it is hidden. */
    .mg-nav { display: none; }
    @media (min-width: 1200px) and (min-height: 420px) {
      .mg-nav {
        --mg-w: 168px;
        box-sizing: border-box;
        display: block;
        position: fixed; z-index: 10;
        width: var(--mg-w);
        right: calc(50vw + 400px + 20px);
        top: max(24px, calc((100vh - 1280px) / 2 + 24px));
        padding: 10px;
        border-radius: 16px;
        background: rgba(24, 23, 34, .72);
        border: 1px solid rgba(255, 255, 255, .09);
        box-shadow: 0 10px 30px -12px rgba(0, 0, 0, .6);
        -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      .mg-nav .mg-brand {
        display: flex; align-items: center; gap: 8px;
        padding: 2px 6px 10px; margin-bottom: 6px;
        border-bottom: 1px solid rgba(255, 255, 255, .08);
        font-size: 11px; font-weight: 700; letter-spacing: .14em;
        text-transform: uppercase; color: #9f9bc4;
      }
      .mg-nav .mg-brand b { color: #e9e7fb; font-weight: 700; }
      .mg-nav .mg-brand svg { width: 18px; height: 18px; flex: none; }
      .mg-nav a {
        display: flex; align-items: center; gap: 10px;
        padding: 9px 8px; border-radius: 10px;
        color: #cfcce9; text-decoration: none;
        font-size: 14px; font-weight: 600; line-height: 1.2;
        transition: background-color .15s, color .15s;
      }
      .mg-nav a svg { width: 18px; height: 18px; flex: none; opacity: .85; }
      .mg-nav a:hover { background: rgba(142, 194, 255, .13); color: #fff; }
      .mg-nav a:hover svg { opacity: 1; }
      .mg-nav a:focus-visible { outline: 2px solid #8ec2ff; outline-offset: 1px; color: #fff; }
      .mg-nav a:active { background: rgba(142, 194, 255, .2); }
    }
  </style>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <nav class="mg-nav" aria-label="Munna Games">
    <div class="mg-brand">
      <svg viewBox="0 0 64 64" fill="none" aria-hidden="true">
        <rect x="3" y="3" width="58" height="58" rx="14" fill="#0e0f13" stroke="#3c4150"/>
        <g stroke="#8ec2ff" stroke-width="3.4" stroke-linecap="round">
          <line x1="25" y1="12" x2="25" y2="52"/><line x1="39" y1="12" x2="39" y2="52"/>
          <line x1="12" y1="25" x2="52" y2="25"/><line x1="12" y1="39" x2="52" y2="39"/>
        </g>
        <g stroke="#c084fc" stroke-width="4" stroke-linecap="round">
          <line x1="15" y1="15" x2="21" y2="21"/><line x1="21" y1="15" x2="15" y2="21"/>
        </g>
        <circle cx="45.5" cy="45.5" r="4.4" stroke="#8ec2ff" stroke-width="4"/>
      </svg>
      <span><b>Munna</b> Games</span>
    </div>
    <a href="/dual-play/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
      Dual Play
    </a>
    <a href="/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></svg>
      All Games
    </a>
  </nav>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
